# Stream Ember Runtime (RDR2) — derleme, test, paket ve otomatik release.
#
#   pull request / diğer dallar  → derle, paket artifact olarak yüklenir (sürüm 1.0.N-ci.<run>)
#   main'e her push              → derle, v1.0.N etiketi ve GitHub Release (zip + sha256)
#
# Dış bağımlılık yok: ScriptHookRDR2 SDK'sının gereken iki dosyası (sdk/) depodadır.
#
# Sürüm: VERSION dosyası (major.minor) + o dosyanın son değiştiği commit'ten bu yana commit sayısı (patch).
# Minör/majör artırmak = VERSION'ı değiştirip pushlamak (o commit x.y.0 olur). Ayrıntı: tools/StreamEmber.Build.psm1
name: Build

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md', 'docs/**', '.github/dependabot.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # patch numarası git geçmişinden hesaplanır

      - name: Sürüm
        id: version
        shell: pwsh
        run: |
          Import-Module ./tools/StreamEmber.Build.psm1
          $release = ('${{ github.ref }}' -eq 'refs/heads/main') -and ('${{ github.event_name }}' -ne 'pull_request')
          $kind = if ($release) { 'Release' } else { 'CI' }
          $version = Get-SEVersion -RepositoryRoot . -Kind $kind -RunNumber '${{ github.run_number }}'
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Sürüm: $version (release: $release)"

      - name: Derle ve paketle
        shell: pwsh
        run: ./build.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Paket içeriği kontrolü
        shell: pwsh
        run: |
          $stage = 'dist/RDR2'
          $expected = @('StreamEmber.Runtime.RDR2.asi', 'StreamEmber/Runtime/StreamEmber.Scripting.RDR2.dll',
                        'StreamEmber/Config/Runtime.ini', 'StreamEmber/Manifests/StreamEmber.Runtime.RDR2.json')
          foreach ($f in $expected) { if (-not (Test-Path (Join-Path $stage $f))) { throw "Pakette yok: $f" } }
          $unwanted = Get-ChildItem $stage -Recurse -File | Where-Object { $_.Extension -in '.pdb', '.xml' }
          if ($unwanted) { throw "Pakette istenmeyen dosya: $($unwanted.Name -join ', ')" }
          Get-ChildItem $stage -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path $stage).Path.Length + 1) }

      - uses: actions/upload-artifact@v7
        with:
          name: StreamEmber.Runtime.RDR2-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: StreamEmber.Runtime.RDR2-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Etiket zaten var mı? (aynı commit'in yeniden çalıştırılması)
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ needs.build.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v${{ needs.build.outputs.version }} zaten yayında; atlanıyor."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Stream Ember Runtime (RDR2) ${{ needs.build.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/*.zip
            artifacts/*.sha256
