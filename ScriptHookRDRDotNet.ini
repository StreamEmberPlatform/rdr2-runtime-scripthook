// ScriptHookRDRDotNet settings (StreamEmber defaults)
// Key names: System.Windows.Forms.Keys (e.g. F4, Insert, None). F7/F8 are used by the StreamEmber overlay.
ReloadKey=None
ConsoleKey=F4
// Milliseconds a script may run without yielding before it is aborted (clamped to 100..60000)
ScriptTimeoutThreshold=5000
