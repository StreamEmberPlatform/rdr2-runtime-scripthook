; StreamEmber Runtime (RDR2) - <game>\StreamEmber\Config\Runtime.ini
; Lines starting with ';', '#' or '//' are ignored.
; Key names: https://learn.microsoft.com/dotnet/api/system.windows.forms.keys (e.g. F4, Insert, None).
; F7 / F8 are used by the StreamEmber overlay.

; Reload all scripts (None = off)
ReloadKey=None

; Open / close the runtime console
ConsoleKey=F4

; Milliseconds a script may run without yielding before it is aborted (clamped to 100..60000)
ScriptTimeoutThreshold=5000

; Scripts folder. Relative paths start at the game folder (where RDR2.exe is).
ScriptsLocation="StreamEmber\Scripts"
